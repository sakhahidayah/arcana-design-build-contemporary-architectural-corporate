services:
  postgres:
    image: postgres:17
    container_name: designbuild_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: designbuild_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: designbuild_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designbuild_admin -d designbuild_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
